appId: com.electron.app
productName: my-electron-app
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.js,.prettierignore,tsconfig.*}'
mac:
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
