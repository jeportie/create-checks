name: AI Review (GitHub Models)

# Free AI PR review via GitHub Models — no API key or subscription.
# Uses the built-in GITHUB_TOKEN with `models: read`; the free tier is rate-limited.
# POC: if it misbehaves, confirm the action inputs/outputs and the model id against
# https://github.com/actions/ai-inference and https://github.com/marketplace/models

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip PRs from forks (their GITHUB_TOKEN is read-only and can't comment).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build review prompt from the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git diff --unified=1 "$BASE_SHA" "$HEAD_SHA" \
            -- . ':(exclude)**/package-lock.json' ':(exclude)**/pnpm-lock.yaml' > full.diff || true
          {
            echo "You are reviewing a pull request for the tskickstart scaffolding CLI."
            echo "Be concise. Prioritise correctness, security, and changes to generators/"
            echo "templates that could break a scaffolded project. Consider the promptless"
            echo "env-var interface (src/prompts) and the E2E matrix (scripts/e2e) where relevant."
            echo "Reply in markdown: a one-paragraph summary, then bulleted findings with"
            echo "file:line where possible. If it looks good, say so briefly."
            echo
            echo "PR title: ${PR_TITLE}"
            echo
            echo '### Diff (truncated to 40k chars)'
            echo '```diff'
            head -c 40000 full.diff
            echo
            echo '```'
          } > prompt.txt

      - name: AI review
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          prompt-file: prompt.txt
          max-tokens: 1000

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESPONSE: ${{ steps.ai.outputs.response }}
        run: |
          {
            echo "🤖 **AI review (GitHub Models · POC)**"
            echo
            printf '%s\n' "${RESPONSE:-_No response from the model (free-tier rate limit?)._}"
            echo
            echo "_Automated, non-blocking. Free-tier GitHub Models — may be rate-limited._"
          } > review.md
          gh pr comment "$PR" --body-file review.md
