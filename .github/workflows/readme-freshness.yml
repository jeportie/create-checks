name: README freshness

# Ties documentation to features at the source: a PR to `dev` that adds a
# user-facing feature must also update README.md (the npm package page), so
# features can never accumulate undocumented and ship in a stale release.
#
# Checks the PR TITLE (the squash-merge subject) and the PR's commits for a
# `feat:` type, excluding internal scopes. Escape hatch: add the
# `readme-exempt` label for a feature that genuinely needs no docs change.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readme-updated-for-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require README docs for feature PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail

          # Escape hatch — an explicitly exempted PR skips the check.
          if printf '%s' "$LABELS" | grep -qw 'readme-exempt'; then
            echo "✔ 'readme-exempt' label present — skipping README freshness check."
            exit 0
          fi

          # A user-facing feature signal = the PR title OR any commit subject is
          # a `feat:` (internal scopes excluded). Title covers squash-merges.
          FEATS=$(
            { printf '%s\n' "$PR_TITLE"; git log "${BASE_SHA}..${HEAD_SHA}" --format='%s'; } \
              | grep -iE '^feat(\([a-z0-9_-]+\))?!?:' \
              | grep -viE '^feat\((ci|agents|e2e|deps)\)!?:' \
              | sort -u \
              || true
          )

          if [ -z "$FEATS" ]; then
            echo "✔ No user-facing feat: change in this PR — README check not required."
            exit 0
          fi

          # Does the PR itself touch README.md?
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -qx 'README.md'; then
            echo "✔ README.md is updated in this PR."
            exit 0
          fi

          echo "::error title=README not updated::This PR adds a feature but does not update README.md."
          {
            echo "### ❌ README not updated"
            echo ""
            echo "This PR introduces a user-facing feature but does not touch \`README.md\`"
            echo "(the npm package page). Document it in this PR, or add the \`readme-exempt\`"
            echo "label if it genuinely needs no docs change."
            echo ""
            echo "Feature signal(s):"
            printf '%s\n' "$FEATS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Feature signal(s) missing README docs:"
          printf '%s\n' "$FEATS" | sed 's/^/  • /'
          exit 1
