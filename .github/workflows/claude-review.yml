name: Claude Review

# Automated PR review by Claude Code.
#
# PREREQUISITE: add an `ANTHROPIC_API_KEY` repository secret
#   (Settings → Secrets and variables → Actions). Until it exists the job
#   detects the missing key and skips — no red X on PRs.
#
# NOTE: confirm the action ref and input names against
#   https://github.com/anthropics/claude-code-action before relying on it;
#   the action's inputs have changed across major versions.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping Claude review."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        if: steps.guard.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request. Prioritise:
              - correctness of generator/template changes that could break a scaffolded project;
              - the promptless env-var interface staying consistent (src/prompts/*.js);
              - adherence to Conventional Commits and the repo lint/format rules;
              - whether the E2E matrix (scripts/e2e) should be extended for the change.
            Leave concise inline comments and a short summary. Do not approve; review only.
