name: Bug report
description: Report a problem with the CLI or a scaffolded project
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in enough for us to reproduce.
  - type: input
    id: version
    attributes:
      label: tskickstart version
      placeholder: 'e.g. 1.8.0'
    validations:
      required: false
  - type: dropdown
    id: project-type
    attributes:
      label: Project type
      options:
        - npm-lib
        - cli
        - backend
        - frontend
        - app
        - n/a
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The exact prompts / env vars used (e.g. PROJECT_TYPE=backend DB_ENGINE=postgresql ...).
      placeholder: 'PROJECT_TYPE=backend BACKEND_FRAMEWORK=hono ... node ./src/index.js'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
